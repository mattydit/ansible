---
version: '2'
services:

    control-center:
      image: confluentinc/cp-enterprise-control-center
      hostname: control-center
      container_name: control-center
      ports:
        - "9021:9021"
      environment:
        CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka-1:9092,kafka-2:9092,kafka-3:9092'
        CONTROL_CENTER_ZOOKEEPER_CONNECT: 'zookeeper-1:2181'
        CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: '10.61.191.44:8083'
        CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT: '/connectors'
  #      CONTROL_CENTER_KSQL_KSQLDB1_URL: "http://ksqldb-server:8088"
  #      CONTROL_CENTER_KSQL_KSQLDB1_ADVERTISED_URL: "http://localhost:8088"
        CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://10.61.191.44:8081"
        CONTROL_CENTER_REPLICATION_FACTOR: 3
        CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 9
        CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 9
        CONFLUENT_METRICS_TOPIC_REPLICATION: 3
        PORT: 9021